[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fastrag"
version = "0.1.0"
description = "Production-hardened retrieval augmented generation service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langfuse>=4,<5",
  "llama-index-core>=0.12,<1",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "qdrant-client[fastembed]>=1.12,<2",
  "redis>=5.2,<6",
  "rq>=2,<3",
  "sse-starlette>=2.1,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
ingest = [
  "pypdf>=5,<6",
]
corpus = [
  "huggingface-hub>=0.26,<1",
  "pyarrow>=18,<22",
]
eval = [
  "langchain-openai>=0.3,<1",
  "ragas>=0.2,<1",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
fastrag = "fastrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fastrag"]

# Vercel Python runtime: FastAPI lives under src/, not a default entrypoint name.
# https://vercel.com/docs/frameworks/backend/fastapi#exporting-the-fastapi-application
[tool.vercel]
entrypoint = "src.fastrag.api:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fastrag"]

[[tool.mypy.overrides]]
module = ["ragas.*", "langchain_core.*", "langchain_openai"]
ignore_missing_imports = true
